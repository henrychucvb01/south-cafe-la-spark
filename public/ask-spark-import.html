<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ask SPARK Corpus Import</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; background: #f4f6f8; color: #1f2937; }
    .wrap { max-width: 760px; margin: 40px auto; padding: 24px; }
    .card { background: white; border-radius: 16px; padding: 28px; box-shadow: 0 8px 28px rgba(0,0,0,.08); }
    h1 { margin-top: 0; font-size: 28px; }
    p { line-height: 1.5; }
    label { display: block; font-weight: 700; margin: 18px 0 8px; }
    input[type="password"], input[type="file"] { width: 100%; box-sizing: border-box; padding: 12px; }
    button { margin-top: 18px; padding: 12px 18px; border: 0; border-radius: 10px; font-weight: 700; cursor: pointer; }
    button:disabled { cursor: not-allowed; opacity: .5; }
    progress { width: 100%; height: 24px; margin-top: 18px; }
    .status { margin-top: 16px; padding: 14px; background: #eef2f7; border-radius: 10px; white-space: pre-wrap; }
    .warning { padding: 12px; background: #fff5d6; border-radius: 10px; }
    .good { background: #e8f7ee; }
    .bad { background: #fdecec; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>Ask SPARK Training Library Import</h1>
      <p class="warning">Temporary Preview-only tool. It uploads the approved Phase 1 corpus into Supabase and creates Gemini embeddings. The file is read in your browser and sent in small batches; it is not added to GitHub.</p>

      <label for="token">Import token</label>
      <input id="token" type="password" autocomplete="off" placeholder="Enter the ASK_SPARK_IMPORT_TOKEN value" />

      <label for="file">chunks.jsonl</label>
      <input id="file" type="file" accept=".jsonl,application/json,text/plain" />

      <button id="start">Validate and Import</button>
      <progress id="progress" value="0" max="1415" hidden></progress>
      <div id="status" class="status">Waiting for file.</div>
    </div>
  </div>

  <script>
    const EXPECTED_DOCUMENTS = 96;
    const EXPECTED_CHUNKS = 1415;
    const BATCH_SIZE = 25;

    const tokenInput = document.getElementById('token');
    const fileInput = document.getElementById('file');
    const startButton = document.getElementById('start');
    const progress = document.getElementById('progress');
    const statusBox = document.getElementById('status');

    function setStatus(message, kind) {
      statusBox.textContent = message;
      statusBox.className = 'status' + (kind ? ' ' + kind : '');
    }

    async function callApi(body, token) {
      const response = await fetch('/api/ask-spark-import', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'x-ask-spark-import-token': token,
        },
        body: JSON.stringify(body),
      });
      const data = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(data.error || `Import request failed (${response.status}).`);
      return data;
    }

    function parseCorpus(text) {
      const lines = text.split(/\r?\n/).filter((line) => line.trim());
      const rows = lines.map((line, index) => {
        try {
          return JSON.parse(line);
        } catch {
          throw new Error(`Invalid JSON on line ${index + 1}.`);
        }
      });

      const documents = new Set();
      const required = ['chunk_id','document_id','text','source_sha256','source_filename','title','topic_category','source_type','locator_type','citation_label'];
      rows.forEach((row, index) => {
        required.forEach((field) => {
          if (typeof row[field] !== 'string' || !row[field].trim()) {
            throw new Error(`Line ${index + 1} is missing ${field}.`);
          }
        });
        documents.add(row.document_id);
      });

      if (documents.size !== EXPECTED_DOCUMENTS || rows.length !== EXPECTED_CHUNKS) {
        throw new Error(`Safety check failed. Found ${documents.size} documents and ${rows.length} chunks. Expected ${EXPECTED_DOCUMENTS} documents and ${EXPECTED_CHUNKS} chunks.`);
      }
      return rows;
    }

    startButton.addEventListener('click', async () => {
      const token = tokenInput.value.trim();
      const file = fileInput.files[0];
      if (!token) return setStatus('Enter the import token first.', 'bad');
      if (!file) return setStatus('Choose chunks.jsonl first.', 'bad');

      startButton.disabled = true;
      fileInput.disabled = true;
      tokenInput.disabled = true;
      progress.hidden = false;
      progress.value = 0;

      try {
        setStatus('Reading and validating the corpus...');
        const rows = parseCorpus(await file.text());
        setStatus(`Validated ${EXPECTED_DOCUMENTS} documents and ${EXPECTED_CHUNKS} chunks. Starting upload...`);

        for (let offset = 0; offset < rows.length; offset += BATCH_SIZE) {
          const batch = rows.slice(offset, offset + BATCH_SIZE);
          await callApi({ action: 'import', rows: batch }, token);
          progress.value = Math.min(offset + batch.length, rows.length);
          setStatus(`Uploaded and embedded ${progress.value} / ${rows.length} chunks...`);
        }

        setStatus('Upload finished. Verifying Supabase counts...');
        const result = await callApi({ action: 'verify' }, token);
        if (!result.complete) {
          throw new Error(`Verification did not match. Documents: ${result.documents}, chunks: ${result.chunks}, embedded: ${result.embeddedChunks}.`);
        }

        setStatus(`Complete.\nDocuments: ${result.documents}\nChunks: ${result.chunks}\nEmbeddings: ${result.embeddedChunks}\n\nAsk SPARK Phase 1 training library is loaded.`, 'good');
      } catch (error) {
        setStatus(error.message || 'Import failed.', 'bad');
      } finally {
        startButton.disabled = false;
        fileInput.disabled = false;
        tokenInput.disabled = false;
      }
    });
  </script>
</body>
</html>
